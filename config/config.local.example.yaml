# Essential 
application:
  name:
  port:
  version: 
  environment: local # one of local, dev, uat, staging, prod, production
  host: 
  timeout:
  timezone: "Asia/Jakarta"
  max_body_size: 1M
  # CIDRs of reverse proxies whose X-Forwarded-For is trusted, e.g. ["10.0.0.0/8"].
  # Leave empty when clients connect directly.
  trusted_proxies: []
  # HTTP server timeouts (Go durations). Defaults: 5s, 15s, 30s, 60s.
  read_header_timeout: 5s
  read_timeout: 15s
  write_timeout: 30s
  idle_timeout: 60s
postgresql:
  name:
  user:
  password:
  host:
  port:
  ssl_mode: disable
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime: "1h"
# Each secret must be at least 32 bytes and must not contain "replace-with-",
# so these placeholders fail startup until replaced. Generate each value with
# `openssl rand -base64 48`, or call generator.APIKey() from Go.
authorization:
  issuer: go-echo-boilerplate
  access:
    secret: replace-with-a-random-access-secret-of-32-bytes-or-more
    duration: 15m
  refresh:
    secret: replace-with-a-different-random-refresh-secret-of-32-bytes
    duration: 168h
  api_key: replace-with-a-random-api-key-of-32-bytes-or-more
hash:
  salt:
cors:
  allowed_origins: ["http://localhost:3000"]
  headers_allowed: ["X-API-Key"]
rate_limit:
  enabled: true
  rate: 5
  burst: 10
  expires_in: 3m

# Idempotency-Key replay window for POST /users
idempotency:
  ttl: 10m

# Third Party
google:
  client_id: ""
  client_secret: ""
  redirect_uri: ""
  user_info_url: "https://www.googleapis.com/oauth2/v2/userinfo"
