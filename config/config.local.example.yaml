# Essential 
application:
  name:
  port:
  version: 
  environment: 
  host: 
  timeout:
  timezone: "Asia/Jakarta"
  max_body_size: 1M
postgresql:
  name:
  user:
  password:
  host:
  port:
  ssl_mode: disable
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime: "1h"
authorization:
  issuer: go-echo-boilerplate
  access:
    secret: replace-with-a-strong-access-secret
    duration: 15m
  refresh:
    secret: replace-with-a-different-strong-refresh-secret
    duration: 168h
  api_key: replace-with-an-api-key
hash:
  salt:
cors:
  allowed_origins: ["http://localhost:3000"]
  headers_allowed: ["X-API-Key"]
rate_limit:
  enabled: true
  rate: 5
  burst: 10
  expires_in: 3m

# Third Party
google:
  client_id: ""
  client_secret: ""
  redirect_uri: ""
  state: ""
  user_info_url: "https://www.googleapis.com/oauth2/v2/userinfo"