services:
  app:
    container_name: go-echo-boilerplate-api
    hostname: backend
    image: go-echo-boilerplate:latest
    build:
      context: .
      dockerfile: builds/Dockerfile
      tags:
      - go-echo-boilerplate:latest
    environment:
      - ENV=dev
    volumes:
      - ./config/config.dev.yaml:/app/config/config.dev.yaml
    ports:
      - 8090:8080
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    container_name: go-echo-boilerplate-db
    hostname: pgdb
    image: postgres:latest
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - "5888:5432"
    # Over TCP, because the image's first-run init server listens only on the
    # socket and then restarts.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql

volumes:
  pgdata:
    driver: local