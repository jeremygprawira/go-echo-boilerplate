version: "2"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  default: standard
  enable:
    - errcheck
    - depguard
    - importas
  settings:
    depguard:
      rules:
        pkg-is-leaf:
          files: ["**/internal/pkg/**", "!$test"]
          deny:
            - pkg: go-echo-boilerplate/internal/repository
              desc: internal/pkg is a leaf; data access belongs in internal/repository, called from internal/service
            - pkg: go-echo-boilerplate/internal/service
              desc: internal/pkg is a leaf; it must not depend on services
            - pkg: go-echo-boilerplate/internal/deliveries
              desc: internal/pkg is a leaf; it must not depend on the HTTP layer
            - pkg: go-echo-boilerplate/internal/core
              desc: internal/pkg is a leaf; it must not depend on the composition root
        deliveries-no-persistence:
          files: ["**/internal/deliveries/**", "!$test"]
          deny:
            - pkg: go-echo-boilerplate/internal/repository
              desc: handlers and middleware call internal/service, never the repository
            - pkg: gorm.io
              desc: handlers and middleware call internal/service, never gorm
        service-no-driver:
          files: ["**/internal/service/**", "!$test"]
          deny:
            - pkg: go-echo-boilerplate/internal/repository/pgsql
              desc: services depend on the repository ports in internal/repository, not the pgsql implementation
            - pkg: gorm.io
              desc: services depend on the repository ports, not gorm
    importas:
      no-unaliased: true
      alias:
        - pkg: github.com/labstack/echo/v4/middleware
          alias: echoMiddleware
